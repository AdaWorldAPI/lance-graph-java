[package]
name = "lgj-abi"
version = "0.1.0"
edition = "2021"
rust-version = "1.98.1"
license = "MIT OR Apache-2.0"
publish = false
description = "The lance-graph-java machine membrane: a self-describing, versioned, bulk-only psABI surface. No C, no JNI, no headers."

[lib]
name = "lgj_abi"
# cdylib  -> the artifact Java's Linker.nativeLinker() dlopen's.
# rlib    -> so the in-crate #[cfg(test)] suite can link and exercise the
#            same code the cdylib exports (a separate build of the same
#            source would not prove anything about the shipped artifact's
#            layout, but the compile-time size asserts in abi.rs do, and
#            they are compiled in both crate types).
crate-type = ["cdylib", "rlib"]

[dependencies]
# The ONLY source of SIMD in this crate (abi.md §8) — that invariant is
# unchanged. ndarray is no longer the crate's only DEPENDENCY, though:
# D-LGJ-W8 adds lance-graph-contract below.
#
# default-features = false + "std":
#   ndarray's own defaults are ["std", "hpc-extras"]; hpc-extras pulls the
#   `p64` and `fractal` path crates, which nothing here needs. "std" alone
#   is what gates `ndarray::simd`, `ndarray::simd_int_ops`, `ndarray::hpc`
#   and `ndarray::bitwise` — i.e. every module this crate consumes.
ndarray = { path = "../../../ndarray", default-features = false, features = ["std"] }

# The `ClassView`/`FieldMask` LAW `lgj_hop` consults — never the full
# lance-graph engine (root CLAUDE.md: the contract/engine split is
# deliberate blast-radius containment, not semantic optionality). This
# crate's `src/` may import ONLY `lance_graph_contract::{canonical_node,
# class_view, facet, ontology}` (the G11 contract-import fence, enforced by
# `tests/g11_contract_import_fence.rs` — until 2026-09-03 this comment was
# the whole fence and it already omitted `facet`) — the
# cognitive modules (kanban, mul, cognition, soa_view, scheduler, …)
# compile UNCONDITIONALLY regardless of feature flags, so the fence, not
# `default-features`, is the only barrier keeping that prohibition real.
#
# default-features = false: lgj-abi mints no GUIDs; the guid-v2-tail /
# guid-v3-tail features are irrelevant to the class_view/ontology surface
# this crate consumes, and the crate compiles fine without them.
lance-graph-contract = { path = "../../../lance-graph/crates/lance-graph-contract", default-features = false }

# The ONE mask evaluator. `plan_eval` lowers `&[LgjOpDesc]` to a
# `mask_risc::Program` and runs it; this crate keeps no second opcode loop.
# That is the whole point of PR4 — before it, `plan_eval_impl` held its own
# accumulate-and-combine loop over `kernels::`, a second evaluator beside the
# one in lance-graph, each able to drift from the other.
#
# It is NOT a second source of SIMD (abi.md §8 is unchanged): mask-risc names
# no ISA at all — a test in that crate greps its own source for one — and
# delegates every op to `ndarray::simd`, the same facade `kernels.rs` uses.
# So the SIMD floor is still ndarray and only ndarray; what moved is who
# sequences the ops.
lance-graph-mask-risc = { path = "../../../lance-graph/crates/lance-graph-mask-risc" }

# The REAL ClassView provider (OGAR Core). `FixtureClassView` answers the same
# 32 facets for every classid; `OgarClassView` walks `ogar_vocab`'s promoted
# classes and gives a genuine per-class field basis -- attributes AND
# associations -- which is what makes `edge_participation` discriminate.
ogar-class-view = { path = "../../../OGAR/crates/ogar-class-view", optional = true }

[dev-dependencies]
# TEST-ONLY, and the boundary is the point. `lance-graph-quack` is the
# DuckDB-shaped query surface in the lance-graph repo; it lowers a Boolean
# TREE to the same `mask_risc::Program` this crate's `plan_lower` lowers a
# flat OP LIST to. The two therefore implement the same law twice — the
# accumulator gate, the AND/OR gating asymmetry, the drop of ops before the
# first AND — and nothing compared them, because each has its own oracle:
# this crate's is the frozen pre-PR4 loop, quack's is a per-row reading.
# Neither can see the other drift.
#
# `src/exports/tests/lowering_convergence.rs` closes that, and it is a
# dev-dependency rather than a real one ON PURPOSE: the membrane must not
# depend on a consumer of the IR it serves. Sharing the LAW is the goal;
# sharing a DEPENDENCY in that direction would invert the layering. What
# ships is the differential, not a delegation.
lance-graph-quack = { path = "../../../lance-graph/crates/lance-graph-quack" }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
# panic = "abort" is DELIBERATELY ABSENT (abi.md §9). Every extern "C" body
# wraps itself in std::panic::catch_unwind so a panic becomes a negative
# status instead of an unwind into JVM frames (which is UB). catch_unwind
# requires unwinding to be available, so "abort" would silently turn the
# panic-safety layer into a process kill.

[profile.dev]
# Same rule as release: no panic = "abort".

[features]
# Bind the real OGAR ClassView instead of the fixture. OFF by default: the
# generated row store's classid domain (0..16) is disjoint from the
# vocabulary's (>= 0x0100), so binding it changes what every hop answers --
# see `class_view_provider`'s module docs.
ogar-classview = ["dep:ogar-class-view"]

# ogar-class-view pulls `lance-graph-contract` by git branch; this crate pulls
# it by path. Cargo does NOT unify a git source with a path source, so without
# this patch the build carries TWO `lance-graph-contract` crates and therefore
# two incompatible `ClassView` traits -- the same SourceId trap recorded in
# tesseract-rs for `ogar-doc-ir`. The patch collapses both onto the local path.
[patch."https://github.com/AdaWorldAPI/lance-graph"]
lance-graph-contract = { path = "../../../lance-graph/crates/lance-graph-contract" }
